# Spark 侧配置：s3a 指向 minio 的服务名，metastore 指向 metastore 的服务名。
# 这两个名字之所以能用，靠的是 Docker 内嵌 DNS 把 service 名解析成容器 IP——
# 换服务名 = 同时改这里、metastore 的 DB_URI、airflow 的 SQL_ALCHEMY_CONN。
#
# 凭据纪律：本文件里不出现任何密钥。compose 给 spark 容器注入
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY，由 EnvironmentVariableCredentialsProvider 读取。

spark.hadoop.fs.s3a.endpoint               http://minio:9000
spark.hadoop.fs.s3a.path.style.access      true
spark.hadoop.fs.s3a.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false
# 用 AWS SDK 的 EnvironmentVariableCredentialsProvider（在 aws-java-sdk-bundle 里）：
# hadoop-aws 3.3.4 里没有 org.apache.hadoop.fs.s3a.EnvironmentVariableCredentialsProvider 这个类，
# 写它会在 loadAWSProviderClasses 阶段 ClassNotFound。密钥仍只走环境变量，不落文件。
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider

spark.sql.warehouse.dir                    s3a://warehouse/
spark.sql.catalogImplementation            hive
spark.hadoop.hive.metastore.uris           thrift://metastore:9083

# eventLog 暂关（backlog）：S3A 3.3.4 的 eventLog.dir 指向虚拟前缀报 FileNotFoundException，
# 指向桶根又撞 S3Guard "path must be absolute"。方案：先用桶初始化脚本在 logs/spark-events/
# 前缀下放 .keep 哨兵对象再启用。W1 验收不依赖它，不在这里耗时间。
spark.eventLog.enabled                     false
# spark.eventLog.dir                       s3a://logs/spark-events
